#
# Argon ONE V5 OLED & Button Daemon Configuration
#

# I2C bus and address for SSD1306 OLED display
i2c_bus = /dev/i2c-1
i2c_address = 0x3c

# GPIO chip and pin for physical button on OLED assembly
gpio_chip = /dev/gpiochip0
gpio_pin = 4

# Seconds to display each screen before cycling (0 = manual only via button)
screen_duration = 0

# Seconds of idle before turning off OLED to prevent burn-in (0 = always on)
# Wakes up immediately upon button press or high temperature alert
screensaver_timeout = 0

# Display brightness (0 to 255)
brightness = 200

# Temperature alert threshold in °C (overheating alert screen overrides screensaver)
temp_alert_threshold = 80.0

# Subtle pixel shift (anti-burn-in protection)
enable_pixel_shift = false

# Selected card layout variants (a, b, c)
variant_cpu = a
variant_mem = c
variant_net = a
variant_clock = a
