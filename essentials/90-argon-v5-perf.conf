# Argon ONE V5 Safe Memory, Cache, Writeback, Scheduler & Network Optimization (Distro-Agnostic)

# 1. Prioritize physical LPDDR4X-4267 RAM over ZRAM compression
vm.swappiness = 15
vm.vfs_cache_pressure = 80
vm.page-cluster = 0

# 2. Prevent Direct Reclaim micro-stutters & ensure 64 MB atomic DMA reserve (NVMe HMB / GbE / Wi-Fi)
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.min_free_kbytes = 65536

# 3. Smooth non-blocking background storage writeback
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 4. Interactive desktop/terminal responsiveness under heavy multi-core load
kernel.sched_autogroup_enabled = 1

# 5. Low-latency TCP BBR + Fair Queueing + 4-Core RPS Flow Table
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.core.rps_sock_flow_entries = 32768
